<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="meshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="glowPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.65" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" fill-opacity="0.5" />
    </pattern>

    <!-- Filters -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.12); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(8px) translateX(-5px); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 48px; y: 222px; }
        50% { height: 72px; y: 198px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 70px; y: 200px; }
        50% { height: 38px; y: 232px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 90px; y: 180px; }
        50% { height: 110px; y: 160px; }
      }
      @keyframes barGrow4 {
        0%, 100% { height: 60px; y: 210px; }
        50% { height: 85px; y: 185px; }
      }

      .pulse-ambient {
        transform-origin: 960px 200px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .float-box-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .float-box-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
      .dashed-stream {
        stroke-dasharray: 8 6;
        animation: dashMove 4s linear infinite;
      }
      .bar-1 { animation: barGrow1 3.8s ease-in-out infinite; }
      .bar-2 { animation: barGrow2 4.6s ease-in-out infinite; }
      .bar-3 { animation: barGrow3 3.2s ease-in-out infinite; }
      .bar-4 { animation: barGrow4 4.1s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#gridPattern)" rx="16" />
  <rect width="1200" height="420" fill="url(#meshGrad)" rx="16" />

  <!-- Dynamic Background Glowing Orbs (Deep behind text) -->
  <g class="pulse-ambient">
    <circle cx="980" cy="190" r="190" fill="url(#glowPulseGrad)" />
    <circle cx="200" cy="80" r="140" fill="url(#glowPulseGrad)" opacity="0.4" />
  </g>

  <!-- Right Side Interactive Graphic / Dashboard Graphic (Non-blocking, background layer) -->
  <g transform="translate(730, 60)">
    <!-- Main Decorative Card Frame -->
    <rect x="0" y="0" width="410" height="300" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="42" rx="14" fill="#1E293B" fill-opacity="0.8" />
    
    <!-- Window Control Dots -->
    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="42" cy="21" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.8" />
    
    <!-- Mini Terminal Title -->
    <text x="82" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SAM Control Center • Enterprise License Telemetry</text>

    <!-- Animated Data Flow Lines -->
    <path d="M 30 110 Q 120 70 210 110 T 380 95" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.6" class="dashed-stream" />
    <path d="M 30 135 Q 110 160 200 130 T 380 145" fill="none" stroke="#10B981" stroke-width="2" opacity="0.5" class="dashed-stream" style="animation-direction: reverse;" />

    <!-- Metric Card 1: License Compliance -->
    <g class="float-box-1" transform="translate(24, 60)">
      <rect width="168" height="64" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">License Compliance</text>
      <text x="14" y="48" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">99.4%</text>
      <circle cx="146" cy="32" r="10" fill="#0284C7" fill-opacity="0.2" />
      <path d="M 142 32 L 145 35 L 151 29" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Metric Card 2: SaaS Spend Saved -->
    <g class="float-box-2" transform="translate(212, 60)">
      <rect width="172" height="64" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Unused Seats Right-Sized</text>
      <text x="14" y="48" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">-$420K</text>
      <circle cx="150" cy="32" r="10" fill="#10B981" fill-opacity="0.2" />
      <text x="147" y="36" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold">↓</text>
    </g>

    <!-- Animated Histogram / License Optimization Bars -->
    <g transform="translate(24, 0)">
      <!-- Base Axis Line -->
      <line x1="10" y1="270" x2="360" y2="270" stroke="#334155" stroke-width="1.5" />
      
      <!-- Bar 1 (Microsoft 365) -->
      <rect x="35" width="34" rx="4" fill="#38BDF8" opacity="0.85" class="bar-1" />
      <text x="37" y="286" fill="#64748B" font-family="sans-serif" font-size="10">M365</text>

      <!-- Bar 2 (SAP / Oracle) -->
      <rect x="115" width="34" rx="4" fill="#818CF8" opacity="0.85" class="bar-2" />
      <text x="119" y="286" fill="#64748B" font-family="sans-serif" font-size="10">SAP</text>

      <!-- Bar 3 (Salesforce / Zoom) -->
      <rect x="195" width="34" rx="4" fill="#34D399" opacity="0.85" class="bar-3" />
      <text x="196" y="286" fill="#64748B" font-family="sans-serif" font-size="10">SaaS</text>

      <!-- Bar 4 (Self-Hosted / Open-Source) -->
      <rect x="275" width="34" rx="4" fill="#F59E0B" opacity="0.85" class="bar-4" />
      <text x="276" y="286" fill="#64748B" font-family="sans-serif" font-size="10">ITAM</text>
    </g>
  </g>

  <!-- FOREGROUND BRANDING & TYPOGRAPHY (Always on top, fully crisp & legible) -->
  <g transform="translate(70, 0)">
    <!-- Top Category Kicker Pill -->
    <g transform="translate(0, 68)">
      <rect width="320" height="30" rx="15" fill="#1E293B" stroke="#0284C7" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="15" r="5" fill="#38BDF8" />
      <text x="30" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ENTERPRISE SAM &amp; ITAM ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient and Soft Text Glow -->
    <text x="0" y="152" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#textGlow)">
      Awesome Software
    </text>
    <text x="0" y="202" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#textGlow)">
      Asset Management (SAM)
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="244" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Curated directory of enterprise SaaS suites and sovereign open-source projects for
    </text>
    <text x="0" y="268" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      license entitlement reconciliation, SaaS spend FinOps, shadow IT, and ITAM inventory.
    </text>

    <!-- Feature Pill Tags in Foreground -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="150" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📜 License Auditing</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(160, 0)">
        <rect width="164" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💳 SaaS Spend FinOps</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(334, 0)">
        <rect width="144" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🕵️ Shadow IT Discovery</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(488, 0)">
        <rect width="128" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💻 Sovereign ITAM</text>
      </g>
    </g>
  </g>

  <!-- Subtle Bottom Border Accent -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
